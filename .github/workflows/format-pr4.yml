name: Format PR4

on:
  push:
    branches:
      - fix/checkout-historico-despesas-exclusoes-estoque

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-historico-despesas-exclusoes-estoque
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed files
        run: >-
          npx prettier --write
          apps/desktop/src/renderer/src/features/expenses/ExpensesPage.tsx
          apps/desktop/src/renderer/src/features/inventory/StockMovementForm.tsx
          apps/desktop/src/renderer/src/features/tables/CheckoutForm.tsx
          apps/desktop/src/renderer/src/features/tables/OrderPanel.tsx
          apps/desktop/src/renderer/src/features/vouchers/VouchersPage.tsx
          apps/desktop/src/renderer/src/styles/global.css
          packages/database/src/inventory-deletion.ts
          packages/database/src/inventory.spec.ts
          packages/database/src/ticket-deletion.spec.ts
          packages/database/src/ticket-deletion.ts
          packages/database/src/voucher-admin.ts
          packages/database/src/voucher-permanent-deletion.spec.ts
      - name: Remove temporary workflow
        run: git rm .github/workflows/format-pr4.yml
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: aplica prettier ao lote operacional"
          git push origin HEAD:fix/checkout-historico-despesas-exclusoes-estoque
