name: Formatar testes finais

on:
  push:
    branches:
      - fix/fluxo-vendas-mesas-despesas
    paths:
      - .github/workflows/format-final-tests-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/fluxo-vendas-mesas-despesas
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write packages/database/src/vouchers.spec.ts tests/e2e/operations.spec.ts
      - shell: bash
        run: |
          rm -f .github/workflows/format-final-tests-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: formata testes finais" || exit 0
          git push origin HEAD:fix/fluxo-vendas-mesas-despesas
