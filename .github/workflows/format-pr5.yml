name: Formatar PR 5

on:
  push:
    branches:
      - fix/checkout-historico-despesas-exclusoes

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-historico-despesas-exclusoes
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatar arquivos do lote e remover este workflow
        shell: bash
        run: |
          npx prettier --write \
            apps/desktop/src/renderer/src/features/expenses/ExpenseCard.tsx \
            apps/desktop/src/renderer/src/features/inventory/InventoryPage.tsx \
            apps/desktop/src/renderer/src/features/inventory/ProductCard.tsx \
            apps/desktop/src/renderer/src/features/tables/RecentOrdersPanel.tsx \
            apps/desktop/src/renderer/src/features/tables/SimplePaymentSection.tsx \
            apps/desktop/src/renderer/src/features/tickets/TicketLotCard.tsx \
            apps/desktop/src/renderer/src/features/tickets/TicketSaleCard.tsx \
            apps/desktop/src/renderer/src/features/tickets/TicketsPage.tsx \
            apps/desktop/src/renderer/src/features/vouchers/VoucherCard.tsx \
            apps/desktop/src/renderer/src/features/vouchers/VoucherDeleteSection.tsx \
            apps/desktop/src/renderer/src/styles/expenses-compact.css \
            apps/desktop/src/renderer/src/styles/operations-priority.css \
            packages/database/src/ticket-deletion.ts \
            packages/database/src/voucher-admin.ts
          git rm .github/workflows/format-pr5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: aplica Prettier no PR 5'
            git push origin HEAD:fix/checkout-historico-despesas-exclusoes
          fi