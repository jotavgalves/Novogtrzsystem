name: Formatar erros de domínio temporariamente

on:
  push:
    branches:
      - fix/revisao-consistencia-codex
    paths:
      - .github/workflows/format-domain-errors-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/revisao-consistencia-codex
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Aplicar Prettier canônico
        run: >-
          npx prettier --write
          packages/database/src/domain-error-codes.spec.ts
          packages/database/src/operation-stock.ts
          packages/database/src/ticket-repository.ts
          packages/database/src/vouchers.ts
      - name: Remover workflow temporário e publicar
        shell: bash
        run: |
          rm -f .github/workflows/format-domain-errors-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/domain-error-codes.spec.ts packages/database/src/operation-stock.ts packages/database/src/ticket-repository.ts packages/database/src/vouchers.ts .github/workflows/format-domain-errors-temporary.yml
          git commit -m "style: aplica prettier canônico aos erros de domínio"
          git push origin HEAD:fix/revisao-consistencia-codex
