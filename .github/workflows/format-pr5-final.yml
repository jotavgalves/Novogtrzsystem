name: Formatar PR 5 final

on:
  push:
    branches:
      - fix/checkout-historico-despesas-exclusoes

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-historico-despesas-exclusoes
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatar lote final e remover workflow
        shell: bash
        run: |
          npx prettier --write \
            tests/e2e/operations.spec.ts \
            tests/e2e/shell.spec.ts \
            packages/database/src/ticket-direct-deletion.spec.ts \
            packages/database/src/voucher-deactivate-delete.spec.ts \
            packages/database/src/voucher-admin.ts \
            apps/desktop/src/renderer/src/features/vouchers/useVouchers.ts
          git rm .github/workflows/format-pr5-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: aplica Prettier aos testes finais do PR 5'
            git push origin HEAD:fix/checkout-historico-despesas-exclusoes
          fi