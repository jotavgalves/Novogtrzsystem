name: Format PR4 E2E

on:
  push:
    branches:
      - fix/checkout-historico-despesas-exclusoes-estoque

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-historico-despesas-exclusoes-estoque
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format E2E files
        run: >-
          npx prettier --write
          tests/e2e/finance.spec.ts
          tests/e2e/shell.spec.ts
          tests/e2e/tickets.spec.ts
          tests/e2e/vouchers.spec.ts
      - name: Remove temporary workflow
        run: git rm .github/workflows/format-pr4-e2e.yml
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: aplica prettier aos smokes operacionais"
          git push origin HEAD:fix/checkout-historico-despesas-exclusoes-estoque
