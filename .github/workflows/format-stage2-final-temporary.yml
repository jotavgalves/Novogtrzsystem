name: Normalizar lote final da etapa 2

on:
  push:
    branches:
      - fix/revisao-consistencia-codex
    paths:
      - .github/workflows/format-stage2-final-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/revisao-consistencia-codex
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Aplicar Prettier canônico ao lote final
        run: >-
          npx prettier --write
          apps/desktop/src/main/ipc-handler.ts
          apps/desktop/src/main/register-combo-ipc.ts
          apps/desktop/src/main/register-event-close-ipc.ts
          apps/desktop/src/main/register-insights-ipc.ts
          apps/desktop/src/main/register-inventory-ipc.ts
          apps/desktop/src/main/register-ipc.ts
          apps/desktop/src/main/register-operations-ipc.ts
          apps/desktop/src/main/register-ticket-ipc.ts
          apps/desktop/src/main/register-voucher-ipc.ts
          apps/desktop/src/preload/combo-api.ts
          apps/desktop/src/preload/event-close-api.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/preload/insights-api.ts
          apps/desktop/src/preload/inventory-api.ts
          apps/desktop/src/preload/invoke-ipc.ts
          apps/desktop/src/preload/operations-api.ts
          apps/desktop/src/preload/ticket-api.ts
          apps/desktop/src/preload/voucher-api.ts
          apps/desktop/src/renderer/src/features/dashboard/DashboardPage.tsx
          apps/desktop/src/renderer/src/shared/app-error.ts
          packages/contracts/src/errors.ts
          packages/contracts/src/errors.spec.ts
          packages/contracts/src/ipc-error-roundtrip.spec.ts
          packages/contracts/src/insights.ts
          packages/contracts/src/insights.spec.ts
          packages/database/src/audit-write.ts
          packages/database/src/audit.ts
          packages/database/src/cash.ts
          packages/database/src/cash-error-codes.spec.ts
          packages/database/src/catalog-error-codes.spec.ts
          packages/database/src/combos.ts
          packages/database/src/control.ts
          packages/database/src/currency-format.ts
          packages/database/src/database-error.ts
          packages/database/src/database-error.spec.ts
          packages/database/src/dashboard-queries.ts
          packages/database/src/domain-error-codes.spec.ts
          packages/database/src/expense-cancellation.ts
          packages/database/src/expense-error-codes.spec.ts
          packages/database/src/expense-repository.ts
          packages/database/src/expenses.ts
          packages/database/src/inventory.ts
          packages/database/src/migration-upgrade.spec.ts
          packages/database/src/operation-cancellation.ts
          packages/database/src/operation-checkout.ts
          packages/database/src/operation-core.ts
          packages/database/src/operation-error-codes.spec.ts
          packages/database/src/operation-items.ts
          packages/database/src/operation-stock.ts
          packages/database/src/operation-vouchers.ts
          packages/database/src/ticket-repository.ts
          packages/database/src/voucher-admin.ts
          packages/database/src/voucher-admin-error-codes.spec.ts
          packages/database/src/voucher-service-points.ts
          packages/database/src/vouchers.ts
      - name: Remover formatters temporários e publicar
        shell: bash
        run: |
          rm -f .github/workflows/format-stage2-final-temporary.yml
          rm -f .github/workflows/format-voucher-admin-temporary.yml
          rm -f .github/workflows/format-stage2-batch-temporary.yml
          rm -f .github/workflows/format-control-errors-temporary.yml
          rm -f .github/workflows/format-domain-errors-temporary.yml
          rm -f .github/workflows/format-ipc-temporary.yml
          rm -f .github/workflows/format-stage2-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normaliza lote final da etapa 2"
          git push origin HEAD:fix/revisao-consistencia-codex
