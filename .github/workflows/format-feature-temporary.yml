name: Formatar lote estoque e impressão

on:
  push:
    branches:
      - feat/dashboard-estoque-mesas-impressao
    paths:
      - .github/workflows/format-feature-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/dashboard-estoque-mesas-impressao
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Aplicar Prettier canônico
        run: >-
          npx prettier --write
          apps/desktop/src/main/receipt-printer-service.ts
          apps/desktop/src/renderer/src/features/dashboard/DashboardPage.tsx
          apps/desktop/src/renderer/src/features/dashboard/InventoryForecastPanel.tsx
          apps/desktop/src/renderer/src/features/settings/ReceiptSettingsPanel.tsx
          apps/desktop/src/renderer/src/features/tables/RecentOrdersPanel.tsx
          packages/database/src/cash-change.spec.ts
          packages/database/src/dashboard-inventory-forecast.spec.ts
          packages/database/src/operation-receipts.ts
          packages/database/src/service-point-pins.spec.ts
          packages/database/src/service-point-pins.ts
          tests/e2e/operations.spec.ts
      - name: Publicar formatação e remover workflow
        shell: bash
        run: |
          rm -f .github/workflows/format-feature-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normaliza estoque mesas e recibos"
          git push origin HEAD:feat/dashboard-estoque-mesas-impressao
