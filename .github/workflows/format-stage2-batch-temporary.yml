name: Formatar lote acumulado da etapa 2

on:
  push:
    branches:
      - fix/revisao-consistencia-codex
    paths:
      - .github/workflows/format-stage2-batch-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/revisao-consistencia-codex
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Aplicar Prettier canônico ao lote acumulado
        run: >-
          npx prettier --write
          apps/desktop/src/renderer/src/features/dashboard/DashboardPage.tsx
          packages/database/src/cash.ts
          packages/database/src/cash-error-codes.spec.ts
          packages/database/src/expense-repository.ts
          packages/database/src/expenses.ts
          packages/database/src/expense-cancellation.ts
          packages/database/src/expense-error-codes.spec.ts
          packages/database/src/operation-core.ts
          packages/database/src/operation-checkout.ts
          packages/database/src/operation-error-codes.spec.ts
          packages/database/src/currency-format.ts
          packages/database/src/operation-items.ts
          packages/database/src/operation-vouchers.ts
          packages/database/src/operation-cancellation.ts
          packages/database/src/vouchers.ts
          packages/database/src/inventory.ts
          packages/database/src/combos.ts
          packages/database/src/catalog-error-codes.spec.ts
          packages/database/src/domain-error-codes.spec.ts
          packages/database/src/ticket-repository.ts
          packages/database/src/operation-stock.ts
      - name: Remover workflow temporário e publicar
        shell: bash
        run: |
          rm -f .github/workflows/format-stage2-batch-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/renderer/src/features/dashboard/DashboardPage.tsx packages/database/src/cash.ts packages/database/src/cash-error-codes.spec.ts packages/database/src/expense-repository.ts packages/database/src/expenses.ts packages/database/src/expense-cancellation.ts packages/database/src/expense-error-codes.spec.ts packages/database/src/operation-core.ts packages/database/src/operation-checkout.ts packages/database/src/operation-error-codes.spec.ts packages/database/src/currency-format.ts packages/database/src/operation-items.ts packages/database/src/operation-vouchers.ts packages/database/src/operation-cancellation.ts packages/database/src/vouchers.ts packages/database/src/inventory.ts packages/database/src/combos.ts packages/database/src/catalog-error-codes.spec.ts packages/database/src/domain-error-codes.spec.ts packages/database/src/ticket-repository.ts packages/database/src/operation-stock.ts .github/workflows/format-stage2-batch-temporary.yml
          git commit -m "style: aplica prettier canônico ao lote acumulado da etapa 2"
          git push origin HEAD:fix/revisao-consistencia-codex
