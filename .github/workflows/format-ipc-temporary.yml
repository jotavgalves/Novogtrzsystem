name: Formatar contrato IPC temporariamente

on:
  push:
    branches:
      - fix/revisao-consistencia-codex
    paths:
      - .github/workflows/format-ipc-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/revisao-consistencia-codex
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Aplicar Prettier canônico
        run: >-
          npx prettier --write
          apps/desktop/src/main/ipc-handler.ts
          apps/desktop/src/preload/finance-api.ts
          apps/desktop/src/renderer/src/shared/app-error.ts
      - name: Remover workflow temporário e publicar
        shell: bash
        run: |
          rm -f .github/workflows/format-ipc-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main/ipc-handler.ts apps/desktop/src/preload/finance-api.ts apps/desktop/src/renderer/src/shared/app-error.ts .github/workflows/format-ipc-temporary.yml
          git commit -m "style: aplica prettier canônico ao contrato IPC"
          git push origin HEAD:fix/revisao-consistencia-codex
