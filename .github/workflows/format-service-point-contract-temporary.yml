name: Formatar contrato de exclusão de mesa temporariamente

on:
  push:
    branches:
      - fix/revisao-consistencia-codex
    paths:
      - .github/workflows/format-service-point-contract-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/revisao-consistencia-codex
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Aplicar Prettier canônico
        run: npx prettier --write packages/contracts/src/service-point-deletion.spec.ts
      - name: Remover workflow temporário e publicar
        run: |
          git rm .github/workflows/format-service-point-contract-temporary.yml
          git add packages/contracts/src/service-point-deletion.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: formata contrato de exclusão de mesa"
          git push origin HEAD:fix/revisao-consistencia-codex
