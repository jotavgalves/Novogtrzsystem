name: Formatar correções operacionais

on:
  push:
    branches:
      - fix/fluxo-vendas-mesas-despesas
    paths:
      - .github/workflows/format-flow-fixes-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/fluxo-vendas-mesas-despesas
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatar lote alterado
        run: >-
          npx prettier --write
          apps/desktop/src/main
          apps/desktop/src/preload
          apps/desktop/src/renderer/src/features/dashboard
          apps/desktop/src/renderer/src/features/events
          apps/desktop/src/renderer/src/features/expenses
          apps/desktop/src/renderer/src/features/tables
          apps/desktop/src/renderer/src/features/vouchers
          apps/desktop/src/renderer/src/styles/finance.css
          apps/desktop/src/renderer/src/styles/operations.css
          packages/contracts/src
          packages/database/src
          tests/e2e/operations.spec.ts
          tests/e2e/vouchers.spec.ts
      - name: Remover workflow temporário e publicar formatação
        shell: bash
        run: |
          rm -f .github/workflows/format-flow-fixes-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: aplica Prettier ao fluxo operacional"
          git push origin HEAD:fix/fluxo-vendas-mesas-despesas
